<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-green": "#2D7A32",
                        "primary-orange": "#ec5b13",
                        "primary-light": "#5cb85c",
                        "background-light": "#e0e4e8",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "sans": ["Public Sans", "sans-serif"],
                        "serif": ["Times New Roman", "serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    transitionDuration: {
                        "2000": "2000ms",
                    }
                },
            },
        }
    </script>
</head>

<body>
    <div id="register-page" class="page">
        <div class="w-full flex flex-col items-center justify-center min-h-screen p-4">
            <div class="w-full bg-primary-light rounded-2xl overflow-hidden max-w-[500px] shadow-2xl">
                <div class="flex flex-col items-center p-12">
                    <div class="mb-8 flex flex-col items-center gap-4">
                        <div class="size-16 bg-white rounded-full flex items-center justify-center shadow-lg">
                            <span class="material-symbols-outlined text-primary-light text-4xl">school</span>
                        </div>
                        <div class="text-center">
                            <h1 class="text-white text-2xl font-bold tracking-tight">Regístrate aquí</h1>
                            <p class="text-white/80 text-sm font-light mt-1">Sistema de objetos perdidos</p>
                        </div>
                    </div>
                    
                    <form method="post" class="w-full space-y-5">
                        <div class="flex flex-col gap-2">
                            <label class="text-white text-sm font-medium ml-1">Nombre</label>
                            <div class="relative">
                                <input class="form-input rounded-lg placeholder:text-slate-400" placeholder="Chalino" type="text" required/>
                                <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-300">person</span>
                            </div>
                        </div>
                        
                        <div class="flex flex-col gap-2">
                            <label class="text-white text-sm font-medium ml-1">Apellidos</label>
                            <div class="relative">
                                <input class="form-input rounded-lg placeholder:text-slate-400" placeholder="Sánchez Féliz" type="text" required/>
                                <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-300">person</span>
                            </div>
                        </div>

                        <div class="flex flex-col gap-2">
                            <label class="text-white text-sm font-medium ml-1">Matrícula</label>
                            <div class="relative">
                                <input class="form-input rounded-lg placeholder:text-slate-400" placeholder="1234567" type="text" inputmode="numeric" maxlength="7" minlength="7" oninput="this.value = this.value.replace(/\D/g, '')" required/>
                                <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-300">badge</span>
                            </div>
                        </div>
                        
                        <div class="flex flex-col gap-2">
                            <label class="text-white text-sm font-medium ml-1">Correo universitario</label>
                            <div class="relative">
                                <input class="form-input rounded-lg placeholder:text-slate-400" placeholder="chalino@uanl.edu.mx" type="email" required/>
                                <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-300">mail</span>
                            </div>
                        </div>
                        
                        <div class="flex flex-col gap-2">
                            <label class="text-white text-sm font-medium ml-1">Celular (opcional)</label>
                            <div class="relative">
                                <input class="form-input rounded-lg placeholder:text-slate-400" placeholder="8123456789" type="text" inputmode="numeric" maxlength="10" minlength="10" oninput="this.value = this.value.replace(/\D/g, '')"/>
                                <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-300">phone</span>
                            </div>
                        </div>

                        <div class="flex flex-col gap-2">
                            <label class="text-white text-sm font-medium ml-1">Contraseña</label>
                            <div class="relative">
                                <input id="login-pass-1" class="form-input rounded-lg placeholder:text-slate-400" placeholder="Crea una contraseña" type="password" required/>
                                <span id="toggle-password-1" class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 cursor-pointer">visibility</span>
                            </div>
                        </div>

                        <div class="flex flex-col gap-2">
                            <label class="text-white text-sm font-medium ml-1">Confirmar contraseña</label>
                            <div class="relative">
                                <input id="login-pass-2" class="form-input rounded-lg placeholder:text-slate-400" placeholder="Repite tu contraseña" type="password" required/>
                                <span id="toggle-password-2" class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 cursor-pointer">visibility</span>
                            </div>
                        </div>
                        
                        <button type="submit" class="w-full h-12 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-lg shadow-lg transition-colors mt-6 flex items-center justify-center gap-2 group">
                            <span>Registrar</span>
                            <span class="material-symbols-outlined text-lg group-hover:scale-110 transition-transform">person_add</span>
                        </button>
                    </form>
                    
                    <div class="mt-8 pt-6 border-t border-white/10 w-full text-center">
                        <p class="text-white/70 text-xs">
                            © 2026 FindIt Campus. <br/>
                            All rights reserved.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../JS/register.js"></script>
</body>

</html>
