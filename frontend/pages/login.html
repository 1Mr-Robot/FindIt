<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-green": "#2D7A32",
                        "primary-orange": "#ec5b13",
                        "primary-light": "#5cb85c",
                        "background-light": "#e0e4e8",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "sans": ["Public Sans", "sans-serif"],
                        "serif": ["Times New Roman", "serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    transitionDuration: {
                        "2000": "2000ms",
                    }
                },
            },
        }
    </script>
</head>

<body>
    <div id="login-page" class="page">
        <div class="w-full flex flex-col items-center justify-center min-h-screen p-4">
            <div class="w-full bg-primary-light rounded-2xl overflow-hidden max-w-[500px] shadow-2xl">
                <div class="flex flex-col items-center p-12">
                    <div class="mb-8 flex flex-col items-center gap-4">
                        <div class="size-16 bg-white rounded-full flex items-center justify-center shadow-lg">
                            <span class="material-symbols-outlined text-primary-light text-4xl">school</span>
                        </div>
                        <div class="text-center">
                            <h1 class="text-white text-3xl font-bold tracking-tight font-serif">FindIt Campus</h1>
                            <p class="text-white/80 text-sm font-light mt-2">Sistema de objetos perdidos</p>
                        </div>
                    </div>

                    <form method="post" class="w-full space-y-5">
                        {% csrf_token %}

                        <input type="hidden" name="next" value="{{ next }}">

                        <div class="flex flex-col gap-2">
                            <label class="text-white text-sm font-medium ml-1">Correo institucional</label>
                            <div class="relative">
                                <input name="username" class="form-input rounded-lg"
                                    placeholder="chalino.sanchez@uanl.edu.mx" type="email" required />
                                <span
                                    class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-300">badge</span>
                            </div>
                        </div>

                        <div class="flex flex-col gap-2">
                            <label class="text-white text-sm font-medium ml-1">Contraseña</label>
                            <div class="relative">
                                <input id="login-pass" name="password" class="form-input rounded-lg" placeholder="contraseña personal"
                                    type="password" required />
                                <span id="toggle-password"
                                    class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 visibility-toggle cursor-pointer">visibility</span>
                            </div>
                        </div>

                        {% if error %}
                        <p class="text-red-600 text-sm text-center">
                            {{ error }}
                        </p>
                        {% endif %}

                        <button type="submit" class="w-full h-12 bg-slate-900 text-white font-bold rounded-lg mt-6">
                            Iniciar Sesión
                        </button>

                        <div class="text-center mt-6">
                            <p class="text-white text-sm">
                                ¿No tienes cuenta? <a onclick="goToRegister()"
                                    class="font-bold hover:underline cursor-pointer">Regístrate aquí</a>
                            </p>
                        </div>
                    </form>

                    <div class="mt-8 pt-6 border-t border-white/10 w-full text-center">
                        <p class="text-white/70 text-xs">
                            © 2026 FindIt Campus. <br />
                            All rights reserved.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../JS/login.js"></script>
</body>

</html>
