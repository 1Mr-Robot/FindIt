services:
  db:
    image: mysql:8
    container_name: db-findit
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - findit

  web:
    build: .
    container_name: web-findit
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - findit

  nginx:
    image: nginx:alpine
    container_name: nginx-findit
    restart: always
    ports:
      - "8008:80" # Puerto de entrada
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - findit

networks:
  findit:

volumes:
  mysql_data:
  static_volume:
  media_volume: